    Encefalopatías agudas

    Bajo este nombre se encuentran reunidos y descritos los síndromes cerebrales compuestos por asociaciones diversas de alteraciones de la conciencia, convulsiones, parálisis y movimientos involuntarios, accidentes que tienen un inicio agudo y algunos días de duración.

    Los elementos de orientación diagnóstica esenciales son:
        1. carácter difuso o focal de los signos neurológicos,
        2. estado del líquido cefalorraquídeo,
        3. contexto patológico general, infeccioso, respiratorio, circulatorio, renal, hepático o medicamentoso,
        4. exámenes complementarios sistémicos: radiografía pulmonar, investigación de una hematuria o de proteinuria, astrup, monograma, glucemia, amonemia, encuesta etiológica eventual.

    Hay tres situaciones clínicas esenciales:

    A)  Con signos inflamatorios en el LCR y signos neurológicos difusos.
    Estas encefalopatías que representan la primera situación, comienzan con fiebre, cefaleas, signos inflamatorios del LCR, como hipercitosis y signos neurológicos difusos.
    Los signos neurológicos difusos incluyen problemas de la conciencia que se agrava progresivamente, como confusión, alucinaciones, obnubilación hasta llegar al coma. Se acompañan de convulsiones generalizadas o multifocales. EEG difuso no específico, manifestaciones deficitarias (parálisis bilaterales o rápidamente alternantes de los miembros, de los pares craneales, movimientos anormales bilaterales).

    Diagnóstico

    Prácticamente no hay sino un diagnóstico a comprobarse, la encefalitis aguda o inflamación no supurada del parénquima cerebral, a condición que la enfermedad se haya manifestado con algún tiempo de anterioridad; las encefalitis agudas tienen, en efecto, siempre una cierta duración, que va de algunos días a varias semanas, periodo durante el cual los signos neurológicos persisten, se completan, se modifican.

    La encuesta etiológica es de dificultad variable:
        • Al principio puede facilitarse si el contexto clínico corresponde a una enfermedad eruptiva, como sarampión, varicela, vaccinia o a ciertas patologías infecciosas como paperas, mononucleosis infecciosa. Se debe tener muy presente que se trate de un tipo particular de encefalitis, la perivenosa. Es contemporánea de la erupción, presenta lesiones inflamatorias y de demielinización perivenosa típica y en ellas se reconoce habitualmente un mecanismo inmuno-alérgico, aunque en algunos casos se ha puesto en evidencia la presencia viral. Particularidad importante es el ataque medular que la acompaña, traduciéndose por retención durable de orina. Se debe saber también que coexiste, en el curso del sarampión, una encefalitis aguda debida al virus del herpes.
        • La encuesta etiológica es mucho mas difícil cuando este contexto falta, lo que sucede en la mayoría de los casos. Se trata entonces de las “encefalitis primitivas” ligadas a la presencia de un virus situado en el núcleo de la célula.
    La investigación del virus patógeno es difícil. El virus del herpes es frecuentemente la causa, aunque otros virus también pueden ser responsables, como el del sarampión. Se trata de una encefalitis aguda “retardada” del sarampión, es decir que sobreviene algunos meses o años después de la enfermedad eruptiva en forma de una leucoencefalitis esclerosante aguda.
    Esta encefalitis “primitiva retardada” del sarampión puede manifestarse espontáneamente o en aquellos niños que están bajo tratamiento con inmunosupresores.
    La responsabilidad de un virus en la génesis de una encefalitis primitiva no puede ser afirmada sino empleando métodos muy prolijos: estudio comparativo simultaneo de las concentraciones en el LCR (relación LCR/suero), de numerosos anticuerpos virales; cultivo de los mismos a partir del LCR, o por métodos discutibles, como la biopsia cerebral, en la que los resultados son frecuentemente tardíos, o la elevación de anticuerpos y de gammaglobulinas.

    Actitud terapéutica:

    El tratamiento asintomático es un imperativo y se debe hacer en un servicio de cuidados intensivos. Hay que vigilar y prevenir las hemorragias digestivas secundarias a ulcera gástrica o duodenal, accesibles a la cirugía y el edema cerebral, que no es excepcional en las encefalopatías herpéticas.

    La medicación antiviral todavía esta en etapa de estudio; se emplean Acyclovir o Vira A.
    En el caso particular de la romboencefalitis aguda (encefalitis del tronco cerebral), el cuadro es agudo: parálisis múltiples de los nervios craneanos, signos cerebelosos, signos piramidales, con problemas de la conciencia más o menos importantes, hipercitosis del LCR.

    El diagnostico se vuelve difícil ante ciertos tumores del tronco con aparición aguda y con manifestaciones de esclerosis en placas del niño mayor.

    Otros diagnósticos:

    Las meningitis purulentas agudas, las meningitis tuberculosas graves.

    B)   Con signos inflamatorios en el LCR y signos neurológicos focales.

    Estas encefalopatías representan el segundo tipo clínico. Los signos neurológicos focales (unilaterales, de origen central) son la parálisis facial central, hemiplejia central, crisis focales unilaterales frecuentes o subintrantes, raramente una afasia. Con estos antecedentes hay dos diagnósticos que se pueden formular: la encefalitis aguda “seudo-tumoral”, en general de origen herpético y el absceso cerebral.
    La dosificación comparativa del interferón tipo I en la sangre y en el LCR es necesaria, ya que este aumenta en el inicio de la infección herpética, en el líquido cerebral.

