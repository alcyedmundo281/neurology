    \                                                               3-15\n\nESCALA DE ORIOT\n\nSe adapta\
    \ bien a los niños comatosos, bajo técnicas de reanimación respiratoria.\nEstudia la apertura de los\
    \ ojos, la actividad motora, el estado pupilar y los reflejos del tronco. No es agresiva, las estimulaciones\
    \ provienen exclusivamente por la aspiración traqueal.\nEntonces podemos evaluar los reflejos del\
    \ tronco por la mímica, y la tos, son importantes y precisos así como los fotomotores y corneanos.\n\
