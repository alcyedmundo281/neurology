  texto: |
    Puede ser de aparición súbita y puede ser un signo de intoxicación o luego de usar medicamentos ototóxicos, de ciertas infecciones virales como paperas. Puede ser la secuela de una meningitis, de otitis a repetición.

    Otras veces se trata de sordera congénita reportada por los padres o descubierta en el examen de un niño con problemas del lenguaje. Las causas son numerosas. Las más frecuentes son Rubéola congénita y  la Enfermedad de Inclusión Citomegalica. La ictericia nuclear y las sorderas familiares por ejemplo el Síndrome de Waardenburg, hipertelorismo, mechón blanco.

    Ante una sordera unilateral no explicada, debe descartarse mediante estudios radiológicos adecuados los pequeños neurinomas del nervio auditivo sobre todo en enfermedades como la de Recklinghausen.
