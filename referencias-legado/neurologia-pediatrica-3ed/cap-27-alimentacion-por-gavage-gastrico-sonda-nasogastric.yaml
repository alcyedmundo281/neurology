  titulo_en_la_fuente: ALIMENTACION POR GAVAGE GÁSTRICO (SONDA NASOGASTRICA)
  autoria_distinta_del_autor_fundador: false
  citable_como_legado: true
  texto: |
    El material necesario para la alimentación gástrica consiste en una sonda para gavage fina, de plástico opaco a los rayos X; jeringuilla, estetoscopio, papel pH para verificar la buena posición intragástrica; recipiente que se adapta a la extremidad de la sonda y que recibirá la fórmula alimentaria.

    Técnica

    Consiste en colocar la sonda en sitio adecuado por vía oral o nasal (siempre por vía oral en el recién nacido cuando existe un distrés respiratorio). La sonda será manipulada asépticamente con una pinza o con una compresa e introducida lentamente, a una distancia igual a aquella que separa la boca del ombligo. Es necesario fijar la sonda con una mariposa de esparadrapo.

    Es indispensable verificar la buena posición: la extremidad de la sonda debe estar en el estómago. El mejor test de control consiste en inyectar varios mililitros de aire y auscultar el epigastrio. Se debe oír un ruido hidro- aéreo franco. Se puede también aspirar un poco de líquido gástrico y controlar la acidez con papel pH. Esta comprobación debe ser hecha antes de comenzar la alimentación por gavage. Se conocerá de la existencia o no de residuo gástrico aspirando la jeringuilla; si es moderado, inferior a la mitad de la acción precedente, el volumen que se debe inyectar será disminuido en cantidad igual; si la porción retenida en el estómago es importante, superior a la mitad de los gavages anteriores, es necesario reconsiderar la indicación y dar los aportes nutricionales por perfusión, sobre todo en los niños con riesgo de hipoglucemia. También se puede utilizar el método de gavage continuo, gástrico o duodenal. Es este caso con la ayuda de metoclopramide (0.1 a 0.2 mg./Kg. en las comidas). La inyección de la formula alimentaria se efectúa con la jeringuilla y muy lentamente. Después de cada gavage, se lavará la sonda con algunos ml. de agua destilada.

    La sonda se cambia cada 24 a 48 horas. Cuando esta llena de leche se debe pinzar y retirar lentamente. Entre dos gavages, se colocará en un trípode el recipiente que contiene la porción alimentaria, de tal manera que la parte inferior del mismo este a 10 centímetros por encima del nivel del estomago.

