  texto: |
    TORTICOLIS:

    Ante la aparición de una tortícolis o de una rigidez de nuca se debe pensar en lo siguiente:

        • tumor de fosa posterior

        • tumor de médula cervical (alargamiento del canal raquídeo)

        • anomalías de las articulaciones que unen la columna cervical al cráneo

        • síndrome de Grisel, en caso de fiebre y de infección faríngea

        • intolerancia a las fenotiazinas (retracción intensa y dolorosa de la nuca en extensión)

        • ataque a los músculos de la nuca en el curso de una polimiositis

        • tortícolis espasmódica psicógena (muy rara), o una tortícolis espasmódica como manifestación inicial de una distonía muscular deformante

        • tortícolis paroxística benigna, síndrome caracterizado por episodios intermitentes de tortícolis a menudo muy dolorosos; a veces acompañado de vómito, sensaciones de vértigo y de nistagmus durante media hora o incluso puede durar hasta algunos días, la resolución es espontánea después de 5 años.

        • Hipotonía rápida y transitoria de la nuca que puede estar en relación con un miastenia.

    Se recuerda que una posición anormal de la cabeza se presenta a veces de forma intermitente, puede estar ligada a una parálisis oculomotriz, que siempre se debe sospechar.

    CAÍDAS SUBITAS TRANSITORIAS

    Una perdida rápida y transitoria del tono da lugar a una caída que puede tener varias causas:

        • crisis de pequeño mal aquinético (EEG característico)

        • primeras manifestaciones de una leucoencefalitis aguda esclerosante subaguda (EEG: ondas W, periódicas y sincrónicas).

        • Miastenia: caída al momento de realizar un esfuerzo (investigar la ptosis palpebral, signo de fatiga muscular de la tarde y déficit muscular de las raíces de las extremidades).

        • Compresión intermitente de la médula por una anomalía de la articulación atloideo-axoidea provocando caídas rápidas transitorias.

        • Lipotomias emocionales o ligadas al ortostatismo.

    No se debe desconocer las causas de origen psiquiátrico.
